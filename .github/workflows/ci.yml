name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check engine ml compliance utils/dataset_adapter.py utils/demo_data.py database

      - name: Type check (mypy, new standardization/ML/compliance packages)
        run: mypy --ignore-missing-imports --no-strict-optional engine ml compliance
        continue-on-error: true # tightening this incrementally -- see docs/ROADMAP.md Phase 3

      - name: Run tests
        env:
          # tests/conftest.py also sets these, but set here too so any test
          # run directly (not via conftest's autouse fixture path) still works
          ENCRYPTION_KEY: "4P-rbUjRKWXL9dFWq_mJRVI3rE7IYEfjgZbp1JjRk_o="
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest --tb=short -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cloud-carbon-tracker:ci .
